name: CI

# Main requires this job to pass on a branch that includes the latest main (0010). It always
# starts, so the required check reports on every pull request, and its checks run only when the
# change touches more than Markdown and docs/ (CHECKED_PATHS in apps/api/test/ciPaths.ts, decided
# by apps/api/scripts/ci-changes.ts). A doc a test reads is listed there, and a test fails when a
# test reads a path CI skips.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its run; every merge to main finishes its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's merge commit and its first parent, the base branch.
          fetch-depth: 2
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # A pull request's base is its merge commit's first parent; a push's is where main pointed.
      - name: Changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base=HEAD^1
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            base=$BEFORE
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          node apps/api/scripts/ci-changes.ts "$base"
      - if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      # pnpm test compares fixtures with the hash file in the same commit; this compares the hash
      # file with the base's, so an old fixture rewritten with its hash fails too (0014).
      - name: Fixture hashes keep the base's entries
        if: steps.changes.outputs.run == 'true'
        env:
          BASE: ${{ steps.changes.outputs.base }}
        run: pnpm --filter @kerf/api check-fixture-hashes "$BASE"
      - if: steps.changes.outputs.run == 'true'
        run: pnpm lint
      - if: steps.changes.outputs.run == 'true'
        run: pnpm typecheck
      - if: steps.changes.outputs.run == 'true'
        run: pnpm knip
      - if: steps.changes.outputs.run == 'true'
        run: pnpm test
      - if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @kerf/web build
      # headers.test.ts checks the source index.html; this checks the page Vite wrote.
      - name: The CSP allows the built page's inline scripts
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @kerf/web check-csp
      - name: Migrations match the schema
        if: steps.changes.outputs.run == 'true'
        run: |
          pnpm --filter @kerf/api exec drizzle-kit generate
          if [ -n "$(git status --porcelain apps/api/drizzle)" ]; then
            git status --porcelain apps/api/drizzle
            echo "schema.ts has changes with no migration. Run: pnpm --filter @kerf/api db:generate" >&2
            exit 1
          fi
