<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kerf</title>
    <!-- Brand files (#166), made by docs/design/brand/make_brand.py. The SVG follows the system's
         light or dark setting; the ICO is the fallback for browsers without SVG icons. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The preview shown when a link is shared. Link previews need an absolute image URL, so it
         names the production host. -->
    <meta property="og:title" content="Kerf" />
    <meta property="og:description" content="Plans for woodworking projects" />
    <meta property="og:image" content="https://kerf-ivory.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The color at the top of a phone's screen: the title bar's, or a shop mode's bar while one
         is open. Kept in step with tokens.css by src/lib/theme.tsx. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1d23" />
    <!-- The theme chosen on this device (#155), set before the first paint so the page does not
         flash the other scheme. Keep in step with src/lib/theme.tsx. -->
    <script>
      try {
        const theme = localStorage.getItem('kerf-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
          const metas = document.querySelectorAll('meta[name="theme-color"]');
          const chosen = document.querySelector(`meta[name="theme-color"][media*="${theme}"]`);
          for (const meta of metas) meta.content = chosen.content;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
