# Local Postgres for development (decision 0010). Credentials are for this local container only.
#   docker compose up -d     start it
#   pnpm db:migrate          apply migrations
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: kerf
      POSTGRES_PASSWORD: kerf
      POSTGRES_DB: kerf
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kerf -d kerf"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
