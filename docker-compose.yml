# Local Postgres for development (decision 0010). Credentials are for this local container only.
#   docker compose up -d     start it
#   pnpm db:migrate          apply migrations
services:
  postgres:
    # Pinned by digest so every checkout runs the same image; update both together.
    image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_USER: kerf
      POSTGRES_PASSWORD: kerf
      POSTGRES_DB: kerf
    ports:
      # Only this computer can reach it: the password above is published.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kerf -d kerf"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
